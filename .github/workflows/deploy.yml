name: Deploy to EC2

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::072718159856:role/GitHubActions-EC2-Deploy-Role
          aws-region: ca-central-1
      - name: Debug - show OIDC token claims
        run: |
          TOKEN_VALUE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN_VALUE" | cut -d. -f2 | python3 -c "import sys, base64, json; s=sys.stdin.read().strip(); print(json.dumps(json.loads(base64.urlsafe_b64decode(s + '=' * (-len(s) % 4))), indent=2))"
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0af5c0dd9e4749069" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --parameters '{"commands":["cd /var/www/app","git pull origin main","systemctl reload nginx"]}' \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"
          sleep 8
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0af5c0dd9e4749069" \
            --query "Status" --output text)
          echo "Command Status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment FAILED"
            exit 1
          fi
          echo "Deployment SUCCESSFUL 🎉"